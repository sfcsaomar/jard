<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>AMAN · Account</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#01345A">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/panel.css">
<script src="/i18n/ar.js"></script>
<script src="/i18n/en.js"></script>
<script src="/i18n/i18n.js"></script>
<style>
  .box{max-width:420px; margin:7vh auto; padding:0 16px;}
  .box .login-card{padding:22px;}
  .box .login-card h2{margin-bottom:10px;}
  .box input{margin-bottom:10px;}
  .msg{font-size:14px; line-height:1.8;}
  .ok-msg{color:var(--ok);}
  .links{display:flex; gap:14px; justify-content:center; margin-top:16px; font-size:13px; flex-wrap:wrap;}
  .links a{color:var(--text2);}
  .lang-link{background:none; border:none; color:var(--accent); font-family:inherit; font-size:13px; text-decoration:underline; cursor:pointer; padding:0;}
  .who{background:var(--muted); border-radius:9px; padding:10px 12px; margin-bottom:14px; font-size:13.5px;}
</style>
</head>
<body>
<div class="box">
  <div class="login-brand"><img src="/brand/aman-logo-on-dark.svg" alt="AMAN"><div class="ctx" data-i18n="acc.ctx"></div></div>
  <div class="login-card" id="view"><div class="sub" data-i18n="common.loading"></div></div>
  <div class="links">
    <a href="/" data-i18n="acc.link.app"></a><a href="/company" data-i18n="co.panelName"></a><a href="/admin" data-i18n="adm.panelName"></a><button type="button" class="lang-link" data-lang-toggle></button>
  </div>
</div>

<script src="/panel/common.js"></script>
<script src="/panel/account.js"></script>
</body>
</html>
